let currentFilter = 'all';
let currentQuery = '';

// Get URL params
function getUrlParams() {
  const params = new URLSearchParams(window.location.search);
  return {
    q: params.get('q') || '',
    filter: params.get('filter') || 'all'
  };
}

// Highlight matching text
function highlightText(text, query) {
  if (!query) return text;
  const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(regex, '<span class="search-result-highlight">$1</span>');
}

// Search function
function performSearch(query, filter = 'all') {
  currentQuery = query.toLowerCase().trim();
  currentFilter = filter;
  
  if (!currentQuery) {
    renderResults([]);
    document.getElementById('resultsCount').textContent = '';
    return;
  }
  
  let results = searchData.filter(item => {
    const matchesQuery = item.title.toLowerCase().includes(currentQuery) || 
                         item.excerpt.toLowerCase().includes(currentQuery) ||
                         (item.category && item.category.toLowerCase().includes(currentQuery));
    
    if (filter === 'all') return matchesQuery;
    if (filter === 'reviews') return matchesQuery && item.type === 'review';
    if (filter === 'categories') return matchesQuery && item.type === 'category';
    if (filter === 'deals') return matchesQuery && (item.type === 'deal' || item.type === 'comparison');
    return matchesQuery;
  });
  
  renderResults(results);
  document.getElementById('resultsCount').textContent = `${results.length} result${results.length !== 1 ? 's' : ''} found for "${query}"`;
}

// Render results
function renderResults(results) {
  const container = document.getElementById('searchResults');
  
  if (currentQuery && results.length === 0) {
    container.innerHTML = `
      <div class="no-results">
        <div class="no-results-icon"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div>
        <h3>No results found</h3>
        <p>We couldn't find anything matching "${currentQuery}". Try different keywords or browse our categories.</p>
        <a href="categories.html" class="btn btn-primary" style="background:var(--black);color:#fff;display:inline-flex">Browse Categories</a>
      </div>
    `;
    return;
  }
  
  if (!currentQuery) {
    container.innerHTML = `
      <div class="no-results">
        <div class="no-results-icon"><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div>
        <h3>Search StackHK</h3>
        <p>Find AI tool reviews, comparisons, deals, and more.</p>
      </div>
    `;
    return;
  }
  
  container.innerHTML = results.map(item => {
    const typeLabel = item.type === 'review' ? 'Review' : 
                      item.type === 'category' ? 'Category' : 
                      item.type === 'comparison' ? 'Comparison' : 'Deal';
    
    const badgeClass = item.type === 'review' ? 'badge-' + (item.category?.toLowerCase().replace(/\s+/g, '') || 'writing') : '';
    
    return `
      <div class="search-result-item">
        <div class="search-result-header">
          <div class="search-result-icon">${item.emoji}</div>
          <div class="search-result-info">
            <div class="search-result-title"><a href="${item.url}">${highlightText(item.title, currentQuery)}</a></div>
            <div class="search-result-meta">
              <span class="badge ${badgeClass}" style="font-size:.75rem;font-weight:600;padding:.2rem .55rem;border-radius:100px;background:var(--bg2);color:var(--muted)">${typeLabel}</span>
              ${item.category ? `<span style="font-size:.8rem;color:var(--muted)">${item.category}</span>` : ''}
              ${item.score ? `<span class="search-result-score">★ ${item.score}/10</span>` : ''}
            </div>
          </div>
        </div>
        <div class="search-result-excerpt">${highlightText(item.excerpt, currentQuery)}</div>
      </div>
    `;
  }).join('');
}

// Initialize
document.addEventListener('DOMContentLoaded', function() {
  const params = getUrlParams();
  const searchInput = document.getElementById('searchInput');
  
  // Set initial value from URL
  if (params.q) {
    searchInput.value = params.q;
  }
  
  // Set active filter
  document.querySelectorAll('.search-filter').forEach(btn => {
    if (btn.dataset.filter === params.filter) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });
  
  // Perform initial search
  performSearch(params.q, params.filter);
  
  // Search on input
  let debounceTimer;
  searchInput.addEventListener('input', function(e) {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      performSearch(e.target.value, currentFilter);
      // Update URL without reload
      const newUrl = new URL(window.location);
      newUrl.searchParams.set('q', e.target.value);
      window.history.replaceState({}, '', newUrl);
    }, 300);
  });
  
  // Filter buttons
  document.querySelectorAll('.search-filter').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.search-filter').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      currentFilter = this.dataset.filter;
      performSearch(searchInput.value, currentFilter);
      // Update URL
      const newUrl = new URL(window.location);
      newUrl.searchParams.set('filter', currentFilter);
      window.history.replaceState({}, '', newUrl);
    });
  });
});
